# Herdr Cockpit: open what you're looking at in Herdr in VS Code, Cursor, Kiro or Positron, with the Herdr Cockpit
# extension showing your spaces, agents and shells.
#
#   herdr plugin install sriharirao92/vscode-herdr-cockpit/plugin
#
# Everything is one POSIX shell script (herdr-cockpit.sh): no build step, no runtime to install.
id = "sriharirao.vscode-herdr-cockpit"
name = "Herdr Cockpit for VS Code"
version = "0.2.1"
# Tested with herdr 0.9.1 and 0.9.3 (protocol 22), the protocol the Herdr Cockpit extension speaks.
min_herdr_version = "0.9.1"
platforms = ["macos", "linux"]
description = "Work on your Herdr spaces in one VS Code window (or Cursor, Kiro, Positron) with the Herdr Cockpit extension: files, git review, diffs and every editor extension next to your agents, plus Claude Code, Codex and Kiro usage. Opens the space or pane you're on, and selected file:line paths."

[[actions]]
id = "open"
title = "Herdr Cockpit: Open in editor"
contexts = ["global", "workspace", "tab", "pane"]
command = ["sh", "herdr-cockpit.sh", "open"]

[[actions]]
id = "open-file"
title = "Herdr Cockpit: Open selected file in editor"
contexts = ["selection", "pane"]
command = ["sh", "herdr-cockpit.sh", "open-file"]

[[actions]]
id = "review"
title = "Herdr Cockpit: Review changes in editor"
contexts = ["workspace", "pane"]
command = ["sh", "herdr-cockpit.sh", "review"]

[[actions]]
id = "status"
title = "Herdr Cockpit: Status"
contexts = ["global", "workspace", "tab", "pane"]
command = ["sh", "herdr-cockpit.sh", "popup", "status"]

[[actions]]
id = "setup"
title = "Herdr Cockpit: Set up editor"
contexts = ["global", "workspace", "tab", "pane"]
command = ["sh", "herdr-cockpit.sh", "popup", "setup"]

# Interactive screens. Popups get no HERDR_PANE_ID, so actions pass what they need with --env.
[[panes]]
id = "setup"
title = "Herdr Cockpit setup"
placement = "popup"
width = "80%"
height = "80%"
command = ["sh", "-c", "exec sh \"$HERDR_PLUGIN_ROOT/herdr-cockpit.sh\" setup"]

[[panes]]
id = "status"
title = "Herdr Cockpit status"
placement = "popup"
width = "80%"
height = 20
command = ["sh", "-c", "exec sh \"$HERDR_PLUGIN_ROOT/herdr-cockpit.sh\" status"]

# Optional (review_on_done in config.toml): open an agent's changes when it finishes.
[[events]]
on = "pane.agent_status_changed"
command = ["sh", "herdr-cockpit.sh", "on-status"]
