# Herdr Hub: open what you're looking at in Herdr in VS Code, Cursor, Kiro or Positron, with the Herdr Hub
# extension showing your spaces, agents and shells.
#
#   herdr plugin install sriharirao92/herdr-hub/plugin
#
# Everything is one POSIX shell script (herdr-hub.sh): no build step, no runtime to install.
id = "sriharirao.herdr-hub"
name = "Herdr Hub"
version = "0.1.0"
# Tested against herdr 0.9.1 (protocol 22), the version the Herdr Hub extension speaks.
min_herdr_version = "0.9.1"
platforms = ["macos", "linux"]
description = "Open the space or pane you're on in VS Code, Cursor, Kiro or Positron with the Herdr Hub extension; open selected file:line paths; review an agent's changes in the editor."

[[actions]]
id = "open"
title = "Herdr Hub: Open in editor"
contexts = ["global", "workspace", "tab", "pane"]
command = ["sh", "herdr-hub.sh", "open"]

[[actions]]
id = "open-file"
title = "Herdr Hub: Open selected file in editor"
contexts = ["selection", "pane"]
command = ["sh", "herdr-hub.sh", "open-file"]

[[actions]]
id = "review"
title = "Herdr Hub: Review changes in editor"
contexts = ["workspace", "pane"]
command = ["sh", "herdr-hub.sh", "review"]

[[actions]]
id = "status"
title = "Herdr Hub: Status"
contexts = ["global", "workspace", "tab", "pane"]
command = ["sh", "herdr-hub.sh", "popup", "status"]

[[actions]]
id = "setup"
title = "Herdr Hub: Set up editor"
contexts = ["global", "workspace", "tab", "pane"]
command = ["sh", "herdr-hub.sh", "popup", "setup"]

# Interactive screens. Popups get no HERDR_PANE_ID, so actions pass what they need with --env.
[[panes]]
id = "setup"
title = "Herdr Hub setup"
placement = "popup"
width = "80%"
height = "80%"
command = ["sh", "-c", "exec sh \"$HERDR_PLUGIN_ROOT/herdr-hub.sh\" setup"]

[[panes]]
id = "status"
title = "Herdr Hub status"
placement = "popup"
width = "80%"
height = 20
command = ["sh", "-c", "exec sh \"$HERDR_PLUGIN_ROOT/herdr-hub.sh\" status"]

# Optional (review_on_done in config.toml): open an agent's changes when it finishes.
[[events]]
on = "pane.agent_status_changed"
command = ["sh", "herdr-hub.sh", "on-status"]
