name: Marketplace identity

# Run once by hand (Actions → Marketplace identity → Run workflow) while setting up Entra ID publishing:
# signs in as the app registration and prints its Azure DevOps profile ID, which the Marketplace publisher's
# Members page accepts for adding the app. No client secret involved. See RELEASING.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      id-token: write
    steps:
      # Pinned to a commit: this step can sign in as the publishing app. Update the SHA and comment together.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Azure DevOps profile ID of the app
        run: |
          # 499b84ac-1321-427f-aa17-267ca6975798 is the Azure DevOps (and Marketplace) resource.
          id=$(az rest --url "https://app.vssps.visualstudio.com/_apis/profile/profiles/me?api-version=7.1-preview.3" --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv)
          echo "Add this ID as a member of the Marketplace publisher: $id"
          echo "### Azure DevOps profile ID: \`$id\`" >> "$GITHUB_STEP_SUMMARY"
